name: Publish npm packages
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@11.17.0
      - run: npm ci
      - run: npm run check
      - run: npm publish --workspace @gamedevland/cyber-ui --access public --provenance
      - run: npm publish --workspace @gamedevland/cyber-ui-sdk --access public --provenance
